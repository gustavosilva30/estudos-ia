[project]
name = "estudos-ia-backend"
version = "0.1.0"
description = "API da Plataforma Inteligente de Estudos com IA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "httpx>=0.28,<0.29",
    "pillow>=13.0,<14",
    "pypdf>=6,<7",
    "python-multipart>=0.0.32,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
